<!DOCTYPE html><html lang="pl" xmlns:th="http://www.thymeleaf.org" th:replace="~{layout/application :: layout('Nowy produkt', 'staff-catalog', ~{::content})}"><body><section th:fragment="content" class="col-lg-8"><h1>Nowy produkt</h1><form method="post" th:action="@{/staff/catalog}" th:object="${form}" class="vstack gap-3">
<div class="alert alert-danger" role="alert" tabindex="-1" data-validation-error-summary th:if="${#fields.hasErrors('*')}"><p class="mb-1">Popraw wskazane pola:</p><ul class="mb-0"><li th:each="error : ${#fields.errors('*')}" th:text="${error}"></li></ul></div>
<div><label class="form-label" for="name">Nazwa</label><input class="form-control" id="name" th:field="*{name}" th:attr="aria-invalid=${#fields.hasErrors('name')}" aria-describedby="name-error" maxlength="255" required><div id="name-error" class="text-danger" th:errors="*{name}"></div></div>
<div><label class="form-label" for="category">Kategoria</label><input class="form-control" id="category" th:field="*{category}" th:attr="aria-invalid=${#fields.hasErrors('category')}" aria-describedby="category-error" maxlength="120" required><div id="category-error" class="text-danger" th:errors="*{category}"></div></div>
<div><label class="form-label" for="description">Opis</label><textarea class="form-control" id="description" th:field="*{description}" th:attr="aria-invalid=${#fields.hasErrors('description')}" aria-describedby="description-error" rows="5" maxlength="10000"></textarea><div id="description-error" class="text-danger" th:errors="*{description}"></div></div>
<div class="d-flex gap-2"><button class="btn btn-primary">Utwórz produkt</button><a class="btn btn-outline-secondary" th:href="@{/staff/catalog}">Anuluj</a></div></form></section></body></html>
