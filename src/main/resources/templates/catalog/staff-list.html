<!DOCTYPE html><html lang="pl" xmlns:th="http://www.thymeleaf.org" th:replace="~{layout/application :: layout('Katalog produktów', 'staff-catalog', ~{::content})}"><body>
<section th:fragment="content"><div class="d-flex justify-content-between align-items-center mb-3"><h1>Katalog produktów</h1><a class="btn btn-primary" th:href="@{/staff/catalog/new}">Nowy produkt</a></div>
<div class="row g-3"><div class="col-lg-8"><div class="table-responsive"><table class="table bg-body"><caption>Produkty i warianty katalogu</caption><thead><tr><th>Produkt</th><th>Kategoria</th><th>SKU</th><th>Status</th><th></th></tr></thead><tbody>
<tr th:each="product : ${products}"><td th:text="${product.name}"></td><td th:text="${product.category}"></td><td th:text="${product.skuCount}"></td><td th:text="${product.active ? 'Aktywny' : 'Nieaktywny'}"></td><td><a th:href="@{/staff/catalog/{id}(id=${product.id})}">Edytuj</a></td></tr>
<tr th:if="${#lists.isEmpty(products)}"><td colspan="5">Brak produktów.</td></tr></tbody></table></div></div>
<aside class="col-lg-4"><div class="card"><div class="card-body"><h2 class="h5">Warianty</h2><form method="post" th:action="@{/staff/catalog/attributes}" class="mb-3"><label class="form-label" for="attribute-name">Nowa cecha</label><div class="input-group"><input class="form-control" id="attribute-name" name="name" maxlength="120" required><button class="btn btn-outline-primary">Dodaj</button></div></form>
<p class="small text-secondary mb-0">Cechy i wartości przypisuje się do SKU na stronie produktu.</p></div></div></aside></div></section></body></html>
