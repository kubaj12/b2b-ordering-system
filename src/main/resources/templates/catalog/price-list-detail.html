<!DOCTYPE html><html lang="pl" xmlns:th="http://www.thymeleaf.org" th:replace="~{layout/application :: layout('Pozycje cennika', 'staff-price-lists', ~{::content})}"><body><section th:fragment="content">
<p><a th:href="@{/staff/price-lists}">← Cenniki i klienci</a></p><h1 th:text="${priceList.name}">Cennik</h1>
<form method="post" th:action="@{/staff/price-lists/{id}(id=${priceList.id})}" class="row g-2 mb-4"><div class="col-md-6"><label class="form-label" for="list-name">Nazwa</label><input id="list-name" class="form-control" name="name" maxlength="160" th:value="${priceList.name}" required></div><div class="col-auto align-self-end"><button class="btn btn-outline-primary">Zmień nazwę</button></div></form>
<div class="card mb-4"><div class="card-body"><h2 class="h5">Dodaj lub zmień cenę SKU</h2><form method="post" th:action="@{/staff/price-lists/{id}/items(id=${priceList.id})}" class="row g-2 align-items-end"><div class="col-md-6"><label class="form-label">Kod SKU</label><input name="skuCode" class="form-control" maxlength="80" required></div><div class="col-md-3"><label class="form-label">Netto PLN</label><input class="form-control" type="number" min="0" step="0.01" name="netPrice" required></div><div class="col-auto"><button class="btn btn-primary">Zapisz cenę</button></div></form></div></div>
<h2 class="h4">Wybrane ceny SKU</h2><div class="table-responsive"><table class="table bg-body"><thead><tr><th>Produkt</th><th>SKU</th><th>Cena netto PLN</th><th></th></tr></thead><tbody><tr th:each="item : ${priceList.items}"><td th:text="${item.product}"></td><td th:text="${item.code}"></td><td th:text="${item.price}"></td><td><form method="post" th:action="@{/staff/price-lists/{id}/items/{skuId}/remove(id=${priceList.id},skuId=${item.skuId})}"><button class="btn btn-sm btn-outline-danger">Usuń i przywróć cenę bazową</button></form></td></tr><tr th:if="${#lists.isEmpty(priceList.items)}"><td colspan="4">Brak pozycji. Klienci przypisani do cennika korzystają wtedy z cen bazowych.</td></tr></tbody></table></div>
</section></body></html>
