<!DOCTYPE html><html lang="pl" xmlns:th="http://www.thymeleaf.org" th:replace="~{layout/application :: layout('Ceny indywidualne klienta', 'staff-price-lists', ~{::content})}"><body><section th:fragment="content">
<p><a th:href="@{/staff/price-lists}">← Cenniki i klienci</a></p><h1 class="h2" th:text="|Ceny indywidualne — ${customer.company}|">Ceny klienta</h1><p class="text-secondary" th:text="${customer.email}"></p>
<div class="card mb-4"><div class="card-body"><h2 class="h5">Przypisany cennik</h2><p th:text="${customer.assignedListName == null ? 'Brak — stosowane są ceny bazowe.' : customer.assignedListName}"></p></div></div>
<div class="card mb-4"><div class="card-body"><h2 class="h5">Dodaj lub zmień cenę indywidualną</h2><form method="post" th:action="@{/staff/price-lists/customers/{id}/prices(id=${customer.id})}" class="row g-2 align-items-end"><div class="col-md-6"><label class="form-label" for="sku-code">Kod SKU</label><input id="sku-code" name="skuCode" class="form-control" maxlength="80" required></div><div class="col-md-3"><label class="form-label" for="net-price">Cena netto PLN</label><input id="net-price" class="form-control" type="number" min="0" step="0.01" name="netPrice" required></div><div class="col-auto"><button class="btn btn-primary">Zapisz cenę</button></div></form></div></div>
<h2 class="h4">Ceny indywidualne</h2><div class="table-responsive"><table class="table bg-body"><thead><tr><th>Produkt</th><th>SKU</th><th>Cena netto PLN</th><th></th></tr></thead><tbody><tr th:each="p : ${pricePage.rows}"><td th:text="${p.product}"></td><td th:text="${p.code}"></td><td th:text="${p.price}"></td><td><form method="post" th:action="@{/staff/price-lists/customers/{customerId}/prices/{skuId}/remove(customerId=${customer.id},skuId=${p.skuId})}"><button class="btn btn-sm btn-outline-danger">Usuń i przywróć cenę cennika lub bazową</button></form></td></tr><tr th:if="${#lists.isEmpty(pricePage.rows)}"><td colspan="4">Brak cen indywidualnych.</td></tr></tbody></table></div>
<nav th:if="${pricePage.totalPages > 1}" aria-label="Paginacja cen indywidualnych"><ul class="pagination"><li class="page-item" th:classappend="${pricePage.page == 0} ? ' disabled'"><a class="page-link" th:href="@{/staff/price-lists/customers/{id}(id=${customer.id},page=${pricePage.page - 1})}">Poprzednia</a></li><li class="page-item disabled"><span class="page-link" th:text="|Strona ${pricePage.page + 1} z ${pricePage.totalPages}|"></span></li><li class="page-item" th:classappend="${pricePage.page + 1 >= pricePage.totalPages} ? ' disabled'"><a class="page-link" th:href="@{/staff/price-lists/customers/{id}(id=${customer.id},page=${pricePage.page + 1})}">Następna</a></li></ul></nav>
</section></body></html>
