<!DOCTYPE html>
<html lang="pl" xmlns:th="http://www.thymeleaf.org">
<body>
<section th:fragment="errorSummary" class="alert alert-danger" role="alert" tabindex="-1"
         data-validation-error-summary th:if="${#fields.hasAnyErrors()}">
    <h2 class="h5" th:text="#{form.error-summary.title}">Popraw błędy w formularzu</h2>
    <ul class="mb-0">
        <li th:each="error : ${#fields.detailedErrors()}">
            <span th:if="${error.global}" th:text="${error.message}">Błąd formularza</span>
            <a th:unless="${error.global}" th:href="${'#' + error.fieldName}" th:text="${error.message}">
                Błąd pola
            </a>
        </li>
    </ul>
</section>

<div th:fragment="fieldErrors(fieldName)" class="invalid-feedback d-block"
     th:id="${fieldName + '-errors'}" th:if="${#fields.hasErrors(fieldName)}">
    <span class="visually-hidden" th:text="#{form.field-errors}">Błędy pola</span>
    <ul class="list-unstyled mb-0">
        <li th:each="error : ${#fields.errors(fieldName)}" th:text="${error}">Błąd pola</li>
    </ul>
</div>
</body>
</html>
