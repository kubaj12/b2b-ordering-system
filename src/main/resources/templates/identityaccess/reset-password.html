<!doctype html>
<html lang="pl" xmlns:th="http://www.thymeleaf.org" th:replace="~{layout/application :: layout('Ustaw nowe hasło', null, ~{::#page-content})}">
<body><section id="page-content" class="bg-body border rounded-3 p-4 mx-auto" style="max-width:32rem">
<h1>Ustaw nowe hasło</h1><p th:if="${completed}" role="status">Hasło zostało zmienione. Zaloguj się ponownie.</p>
<p th:if="${resetError}" role="alert">Nie można zmienić hasła. Sprawdź hasło lub poproś o nowy link.</p>
<form th:unless="${completed}" method="post" th:action="@{/password-reset/{token}(token=${token})}">
<p>Hasło musi mieć co najmniej 12 znaków.</p>
<label for="password">Nowe hasło</label><input class="form-control" id="password" name="password" type="password" autocomplete="new-password" required>
<label for="passwordConfirmation">Powtórz hasło</label><input class="form-control mb-3" id="passwordConfirmation" name="passwordConfirmation" type="password" autocomplete="new-password" required>
<button class="btn btn-primary" type="submit">Zmień hasło</button></form>
<a th:href="@{/password-reset}">Poproś o nowy link</a> <a th:href="@{/login}">Wróć do logowania</a>
</section></body></html>
