<!doctype html>
<html lang="pl" xmlns:th="http://www.thymeleaf.org" th:replace="~{layout/application :: layout('Zmień hasło', null, ~{::#page-content})}">
<body><section id="page-content" class="bg-body border rounded-3 p-4 mx-auto" style="max-width:32rem">
<h1>Zmień hasło</h1>
<p th:if="${completed}" role="status">Hasło zostało zmienione. Wszystkie sesje zostały zakończone. Zaloguj się ponownie.</p>
<p th:if="${passwordError}" role="alert">Nie można zmienić hasła. Sprawdź obecne hasło i wymagania nowego hasła.</p>
<form th:unless="${completed}" method="post" th:action="@{/account/password}">
<p>Nowe hasło musi mieć co najmniej 12 znaków i najwyżej 72 bajty UTF-8.</p>
<label for="currentPassword">Obecne hasło</label><input class="form-control" id="currentPassword" name="currentPassword" type="password" autocomplete="current-password" required>
<label for="password">Nowe hasło</label><input class="form-control" id="password" name="password" type="password" autocomplete="new-password" required>
<label for="passwordConfirmation">Powtórz nowe hasło</label><input class="form-control mb-3" id="passwordConfirmation" name="passwordConfirmation" type="password" autocomplete="new-password" required>
<button class="btn btn-primary" type="submit">Zmień hasło</button></form>
<a th:if="${completed}" th:href="@{/login}">Przejdź do logowania</a>
</section></body></html>
