<!doctype html>
<html lang="pl" xmlns:th="http://www.thymeleaf.org" th:replace="~{layout/application :: layout('Resetowanie hasła', null, ~{::#page-content})}">
<body><section id="page-content" class="bg-body border rounded-3 p-4 mx-auto" style="max-width:32rem">
<h1>Resetowanie hasła</h1>
<p th:if="${requested}" role="status">Jeśli adres jest przypisany do aktywnego konta, wyślemy link do resetowania hasła. Jeśli wiadomość nie dotarła, możesz ponowić prośbę.</p>
<form method="post" th:action="@{/password-reset}">
<label for="email">Adres e-mail</label><input class="form-control mb-3" type="email" id="email" name="email" maxlength="254" autocomplete="email" required>
<button class="btn btn-primary" type="submit">Wyślij link do resetowania hasła</button>
</form><a th:href="@{/login}">Wróć do logowania</a></section></body></html>
