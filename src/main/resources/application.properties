spring.application.name=online-store

app.time.display-zone=Europe/Warsaw

spring.web.locale=pl_PL
spring.web.locale-resolver=fixed
# Spring Boot 4.1 binds MVC error settings from spring.web.error.
spring.web.error.include-binding-errors=never
spring.web.error.include-exception=false
spring.web.error.include-message=never
spring.web.error.include-path=never
spring.web.error.include-stacktrace=never
spring.web.error.whitelabel.enabled=false

# Keep framework diagnostics safe when ordinary root DEBUG logging is enabled.
# Do not enable TRACE for credential-bearing JDBC, SMTP, security, or request categories.
logging.level.org.springframework.jdbc.core=INFO
logging.level.org.hibernate.orm.jdbc.bind=INFO
logging.level.com.zaxxer.hikari=INFO
logging.level.org.springframework.web=INFO
logging.level.org.springframework.security=INFO
logging.level.org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration=ERROR

spring.datasource.url=${B2B_DB_JDBC_URL:}
spring.datasource.username=${B2B_DB_USERNAME:}
spring.datasource.password=${B2B_DB_PASSWORD:}
spring.datasource.hikari.connection-init-sql=SET TIME ZONE 'UTC'

spring.jpa.generate-ddl=false
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.sql.init.mode=never

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.validate-on-migrate=true
spring.flyway.validate-migration-naming=true
spring.flyway.clean-disabled=true
spring.flyway.baseline-on-migrate=false
spring.flyway.out-of-order=false

app.mail.delivery-enabled=${B2B_MAIL_DELIVERY_ENABLED:false}
app.mail.from-address=${B2B_MAIL_FROM_ADDRESS:no-reply@example.test}
spring.mail.host=${B2B_MAIL_HOST:localhost}
spring.mail.port=${B2B_MAIL_PORT:1025}
spring.mail.username=${B2B_MAIL_USERNAME:}
spring.mail.password=${B2B_MAIL_PASSWORD:}
spring.mail.protocol=smtp
spring.mail.default-encoding=UTF-8
spring.mail.test-connection=false
spring.mail.properties[mail.debug]=false
spring.mail.ssl.enabled=${B2B_MAIL_SSL_ENABLED:false}
spring.mail.properties[mail.smtp.auth]=${B2B_MAIL_SMTP_AUTH:false}
spring.mail.properties[mail.smtp.starttls.enable]=${B2B_MAIL_STARTTLS_ENABLED:false}
spring.mail.properties[mail.smtp.starttls.required]=${B2B_MAIL_STARTTLS_REQUIRED:false}
spring.mail.properties[mail.smtp.connectiontimeout]=${B2B_MAIL_CONNECTION_TIMEOUT_MILLIS:5000}
spring.mail.properties[mail.smtp.timeout]=${B2B_MAIL_READ_TIMEOUT_MILLIS:10000}
spring.mail.properties[mail.smtp.writetimeout]=${B2B_MAIL_WRITE_TIMEOUT_MILLIS:10000}

app.image-storage.root=${B2B_IMAGE_STORAGE_ROOT:./var/sku-images}
app.web.base-url=${B2B_BASE_URL:http://localhost:8080}

server.servlet.session.cookie.name=${B2B_SESSION_COOKIE_NAME:B2BSESSION}
server.servlet.session.cookie.secure=${B2B_SESSION_COOKIE_SECURE:false}
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax

app.bootstrap.admin.enabled=${B2B_BOOTSTRAP_ADMIN_ENABLED:false}
app.bootstrap.admin.email=${B2B_BOOTSTRAP_ADMIN_EMAIL:}
app.bootstrap.admin.password=${B2B_BOOTSTRAP_ADMIN_PASSWORD:}
